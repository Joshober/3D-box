services:
  - type: web
    name: 3d-box-viewer
    runtime: static
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist/demo/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
